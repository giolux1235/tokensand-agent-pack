name: Editor repair checks
on:
  push:
    branches: [codex/recheck-editor-repairs]

permissions:
  contents: read

jobs:
  watch:
    name: Recheck repairs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Verify editor saves against the published installer
        run: python tests/editor-save-trial.py packages/tokensand-workflow-check-0.1.14.tgz
