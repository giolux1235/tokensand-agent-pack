name: Tokens& starter cases

on: pull_request

permissions:
  contents: read

jobs:
  review:
    name: Tokens& starter cases
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the author's offline result
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          STARTER_URL: https://github.com/giolux1235/tokensand-agent-pack/releases/download/workflow-check-0.1.25/tokensand-workflow-check-0.1.25.tgz
        run: |
          temp=$(mktemp -d "$RUNNER_TEMP/tokensand-starter.XXXXXX")
          trap 'rm -rf -- "$temp"' EXIT
          if ! curl --fail --silent --show-error --location --proto-redir '=https' --max-time 20 --proto '=https' "$STARTER_URL" -o "$temp/check.tgz" ||
             ! echo "e98b2a701165321a030461301f2c029e1a33431a514f102ff399de43f8d38a77  $temp/check.tgz" | sha256sum --check --status ||
             ! tar -xOzf "$temp/check.tgz" package/starter-pr.mjs > "$temp/verify.mjs"; then
            printf '## Tokens& starter cases\n\nStatus: **verifier unavailable**\nNext: Rerun this job when the pinned public package is available.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          status=0
          node "$temp/verify.mjs" verify || status=$?
          if [[ "$status" == 2 || "$status" == 3 ]]; then
            printf '\nAuthor command: `npx --yes %s --pr-receipt`\n' "$STARTER_URL" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$status" == 100 ]]; then
            printf '\nFrom a trusted checkout of the evaluated revision, run this locally to see the failed cases and checks:\n\n```sh\nnpx --yes %s --offline-workflow ./observe.workflow.mjs\n```\n' "$STARTER_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
